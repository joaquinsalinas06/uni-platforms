    reasoning: >-
      Conteo directo por pasos, output-sensitive: O(lg n) de la búsqueda
      binaria inicial en la columna izquierda, más O(1) por cada cara
      visitada. Se visita exactamente una cara por punto reportado (más un
      puñado de caras vacías), así que el total es O(lg n + k) (#31). El
      espacio es O(n) segmentos porque no todos los rayos se extienden hasta
      el final: algunos se cortan (#25).
