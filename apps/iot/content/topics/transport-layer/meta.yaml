formulas:
  - name: Cabecera mínima de TCP sobre IP
    tex: "H_{TCP/IP} = 20\\,\\text{B}_{TCP} + 20\\,\\text{B}_{IP} = 40\\,\\text{B}"
    reasoning: "Cada segmento TCP lleva al menos 20 bytes de cabecera TCP más 20 de IP; para un sensor que envía pocos bytes, estos 40 B pesan más que el dato y justifican pasar a UDP o salir del stack IP."
    source: "Sem9_IoTT-TransportLayerinIoT#57"
