  - name: Corriente de túnel (proporcionalidad)
    tex: "I \\propto \\rho(z) \\propto e^{-2\\kappa z}"
    reasoning: "La corriente que atraviesa una barrera por efecto túnel cae exponencialmente con el ancho z de la barrera; por eso un canal de pocos átomos deja de aislar y limita la miniaturización del transistor."
