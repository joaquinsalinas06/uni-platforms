id: "web-caching-cookies"
title: "Web Caching, Conditional GET y Manejo de Cookies"
type: "concept"
unit: "s2"
prerequisites:
  - "capa-aplicacion-http"
buildsOn:
  - "capa-aplicacion-http"
usedBy:
  - "lab-http-cookies-condicional"
formulas:
  - name: "Retardo Promedio con Web Caching"
    tex: "T_{\\text{promedio}} = h \\cdot T_{\\text{cache}} + (1 - h) \\cdot (T_{\\text{cache}} + T_{\\text{origen}})"
    reasoning: "Calcula el retardo medio de respuesta experimentado por los clientes considerando la tasa de acierto h en el proxy local y el acceso a Internet en caso de fallo."
  - name: "Intensidad de Tráfico en Enlace de Acceso con Caché"
    tex: "I_{\\text{acceso}} = \\frac{\\beta \\cdot (1 - h) \\cdot L_{\\text{prom}}}{R_{\\text{acceso}}}"
    reasoning: "Cuantifica la reducción del factor de congestión en el enlace cuello de botella de la institución al filtrar una fracción h de solicitudes en el proxy local."
  - name: "Validación Temporal de Caché HTTP"
    tex: "\\Delta t_{\\text{validez}} = t_{\\text{actual}} - t_{\\text{Last-Modified}}"
    reasoning: "Calcula el tiempo transcurrido desde la última modificación del recurso para evaluar frescura o emitir una petición condicional If-Modified-Since."
hasVisualization: false
