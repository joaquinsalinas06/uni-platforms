    {
      "name": "Buffer por regla RFC 3439",
      "tex": "B = RTT \\cdot C",
      "reasoning": "El buffer promedio equivale a un RTT típico (250 ms) por la capacidad del enlace: 10 Gbps dan 2,5 Gbit.",
      "source": "Sem12_NetT-Routers#34"
    },
    {
      "name": "Buffer con N flujos",
      "tex": "B = \\frac{RTT \\cdot C}{\\sqrt{N}}",
      "reasoning": "Recomendación reciente de la slide: con muchos flujos TCP desincronizados basta un buffer menor, dividido por raíz de N.",
