id: "dns-arquitectura-resolucion"
title: "Arquitectura Jerárquica y Resolución DNS"
type: "concept"
unit: "s3"
prerequisites:
  - "capa-aplicacion-http"
buildsOn:
  - "capa-aplicacion-http"
usedBy:
  - "registros-rr-seguridad-dns"
  - "lab-dns-wireshark-nslookup"
formulas:
  - name: "Retardo de resolución DNS sin caché"
    tex: "T_{\\text{DNS}} = \\text{RTT}_{\\text{local}} + \\sum_{i=1}^{n} \\text{RTT}_i"
    reasoning: "El host espera un RTT hacia su DNS local y este consulta secuencialmente a n servidores de la jerarquía, sumando el RTT de cada uno."
  - name: "Ahorro por caché DNS"
    tex: "\\Delta T = T_{\\text{sin caché}} - T_{\\text{con caché}}"
    reasoning: "La caché del DNS local suprime los viajes de ida y vuelta a servidores intermedios (raíz y TLD); el ahorro es la suma de esos RTT."
hasVisualization: true
visualizationType: "net-scene"
