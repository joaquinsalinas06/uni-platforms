formulas:
  - name: "Carga útil máxima de un segmento UDP"
    tex: "2^{16} - 1 - 8 = 65535 - 8 = 65527\\text{ bytes}"
    reasoning: "La slide parte del campo de longitud de 16 bits (máximo 65535 bytes, cabecera incluida) y descuenta los 8 bytes de la cabecera UDP."
  - name: "Carga útil máxima si el datagrama va en IPv4 sin opciones"
    tex: "65535 - 20 - 8 = 65507\\text{ bytes}"
    reasoning: "Los ejercicios (Ejercicios 2, pregunta 8) citan 65 507 bytes como límite teórico del payload UDP; sale de descontar también los 20 bytes de la cabecera IP (cálculo derivado)."
hasVisualization: true
