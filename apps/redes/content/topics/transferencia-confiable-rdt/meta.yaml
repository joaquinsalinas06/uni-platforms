formulas:
  - name: "Retardo de transmisión"
    tex: "d_{\\text{trans}} = \\frac{L}{R}"
    reasoning: "Tiempo para poner los L bits de un paquete en un enlace de tasa R; es el L/R de los diagramas de stop-and-wait."
  - name: "Instante en que stop-and-wait puede enviar el siguiente paquete"
    tex: "t = \\text{RTT} + \\frac{L}{R}"
    reasoning: "En stop-and-wait el emisor no envía hasta que llega el ACK, que llega un RTT después de terminar de transmitir el paquete (slide de pipelining)."
hasVisualization: true
visualizationType: "fsm"
