id: "capa-aplicacion-http"
title: "Capa de Aplicación y Protocolo HTTP (1.0 / 1.1 / 2)"
type: "concept"
unit: "s2"
prerequisites:
  - "arquitectura-capas-internet"
buildsOn:
  - "arquitectura-capas-internet"
usedBy:
  - "web-caching-cookies"
  - "dns-arquitectura-resolucion"
formulas:
  - name: "HTTP no persistente (secuencial)"
    tex: "T = S + 2\\,\\text{RTT}_0\\,(1+N)"
    reasoning: "Cada uno de los N objetos y el HTML base necesita una conexión TCP nueva: handshake de 1 RTT0 más petición/respuesta de 1 RTT0; S es el tiempo de resolución DNS (suma de los RTT_i de los servidores DNS; con caché, S = 0). Cuidado: algunos enunciados llaman S al tamaño del archivo; ese valor es L, no este S."
  - name: "HTTP no persistente con k conexiones paralelas"
    tex: "T = S + 2\\,\\text{RTT}_0 + \\left\\lceil \\tfrac{N}{k} \\right\\rceil 2\\,\\text{RTT}_0"
    reasoning: "Tras el HTML base, los N objetos se descargan en rondas de hasta k conexiones simultáneas, cada ronda de 2 RTT0."
  - name: "HTTP persistente sin pipelining"
    tex: "T = S + 2\\,\\text{RTT}_0 + N\\,\\text{RTT}_0"
    reasoning: "El handshake se paga una vez; cada objeto adicional cuesta una petición/respuesta de 1 RTT0 porque se piden de uno en uno."
  - name: "HTTP persistente con pipelining"
    tex: "T = S + 2\\,\\text{RTT}_0 + \\text{RTT}_0"
    reasoning: "Todos los objetos referenciados se piden en ráfaga sobre la misma conexión, de modo que cuestan 1 RTT0 en conjunto."
hasVisualization: true
visualizationType: "spacetime"
