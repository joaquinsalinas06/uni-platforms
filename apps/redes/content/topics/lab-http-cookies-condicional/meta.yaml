id: "lab-http-cookies-condicional"
title: "Laboratorio: Análisis Avanzado HTTP con Wireshark"
type: "lab"
unit: "s2"
prerequisites:
  - "web-caching-cookies"
  - "lab-wireshark-http-intro"
buildsOn:
