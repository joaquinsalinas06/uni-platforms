id: "protocolos-pipeline-gbn-sr"
title: "Protocolos de Tubería: Go-Back-N vs Selective Repeat"
type: "concept"
unit: "s5"
prerequisites:
  - "transferencia-confiable-rdt"
buildsOn:
  - "transferencia-confiable-rdt"
usedBy:
  - "protocolo-udp"
  - "protocolo-tcp-mecanismos"
formulas:
  - name: "Retardo de transmisión"
    tex: "d_{\\text{trans}} = \\frac{L}{R}"
    reasoning: "Tiempo para transmitir un paquete de L bits a la tasa R del enlace; con L = 8000 bits y R = 1 Gbps vale 8 µs."
  - name: "Instante del siguiente envío en stop-and-wait"
    tex: "t = \\text{RTT} + \\frac{L}{R}"
    reasoning: "Sin pipelining el emisor espera el ACK del primer paquete: llega a RTT + L/R, y recién ahí envía el siguiente (slide de pipelining)."
hasVisualization: true
visualizationType: "spacetime"
