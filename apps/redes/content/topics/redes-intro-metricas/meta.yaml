id: "redes-intro-metricas"
title: "Fundamentos de Redes, Conmutación y Retardos Nodales"
type: "concept"
unit: "s1"
prerequisites: []
buildsOn: []
usedBy:
  - "arquitectura-capas-internet"
  - "capa-aplicacion-http"
formulas:
  - name: "Retardo de transmisión"
    tex: "d_{\\text{trans}} = \\frac{L}{R}"
    reasoning: "Tiempo necesario para poner los L bits de un paquete en un enlace de tasa R bps; depende del tamaño del paquete y de la capacidad, no de la distancia."
  - name: "Retardo de propagación"
    tex: "d_{\\text{prop}} = \\frac{m}{s}"
    reasoning: "Tiempo que tarda un bit en viajar m metros por un medio con velocidad de propagación s m/s; no depende de L ni de R."
  - name: "Retardo extremo a extremo en un enlace"
    tex: "d = \\frac{L}{R} + \\frac{m}{s}"
    reasoning: "Ignorando procesamiento y encolamiento, el paquete llega completo después de transmitirse y de propagarse su último bit."
hasVisualization: true
visualizationType: "spacetime"
