id: "redes-intro-metricas"
title: "Fundamentos de Redes, Conmutación y Retardos Nodales"
type: "concept"
unit: "s1"
prerequisites: []
buildsOn: []
usedBy:
  - "arquitectura-capas-internet"
  - "capa-aplicacion-http"
formulas:
  - name: "Retardo de transmisión"
    tex: "d_{\\text{trans}} = \\frac{L}{R}"
    reasoning: "Tiempo necesario para poner los L bits de un paquete en un enlace de tasa R bps; depende del tamaño del paquete y de la capacidad, no de la distancia."
  - name: "Retardo de propagación"
    tex: "d_{\\text{prop}} = \\frac{m}{s}"
    reasoning: "Tiempo que tarda un bit en viajar m metros por un medio con velocidad de propagación s m/s; no depende de L ni de R."
  - name: "Retardo extremo a extremo en un enlace"
    tex: "d = \\frac{L}{R} + \\frac{m}{s}"
    reasoning: "Ignorando procesamiento y encolamiento, el paquete llega completo después de transmitirse y de propagarse su último bit."
  - name: "Unidad base: convertir antes de reemplazar"
    tex: "\\text{bits},\\ \\text{bps},\\ \\text{s},\\ \\text{m}"
    reasoning: "Regla para todo el curso: llevar tamaños a bits, tasas a bps, tiempos a segundos y distancias a metros antes de usar cualquier fórmula; así no se mezcla Mbps con ×10^6 en un lado y no en el otro."
  - name: "Conversión de tasas (y su inversa)"
    tex: "1\\,\\text{kbps}=10^{3}\\,\\text{bps},\\quad 1\\,\\text{Mbps}=10^{6}\\,\\text{bps},\\quad 1\\,\\text{Gbps}=10^{9}\\,\\text{bps}=10^{3}\\,\\text{Mbps}"
    reasoning: "Prefijos decimales, como en las soluciones de los parciales. Inversa: bps = kbps·10^-3, Mbps·10^-6, Gbps·10^-9 (por ejemplo, 12000 bps = 0,012 Mbps)."
  - name: "Conversión de tamaños (y su inversa)"
    tex: "1\\,\\text{B}=8\\,\\text{bits},\\quad 1\\,\\text{KB}=8\\times10^{3}\\,\\text{b},\\quad 1\\,\\text{MB}=8\\times10^{6}\\,\\text{b}=8\\,\\text{Mb},\\quad 1\\,\\text{GB}=8000\\,\\text{Mb}"
    reasoning: "b minúscula es bit y B mayúscula es byte: Mb y MB difieren en factor 8. Inversa: Mb = MB/8, bits = bytes·8. Si un enunciado dice 1 MB = 2^20 bytes el resultado cambia (16 s contra 16,78 s en el parcial 2025-II); por defecto usar decimal."
  - name: "Conversión de tiempo (y su inversa)"
    tex: "1\\,\\text{s}=10^{3}\\,\\text{ms}=10^{6}\\,\\mu\\text{s}"
    reasoning: "Inversa: ms = s·10^-3 y µs = s·10^-6. Convertir los RTT de ms a s antes de sumarlos con términos L/R, que ya salen en segundos."
  - name: "Atajo coherente Mb entre Mbps"
    tex: "\\frac{L\\,[\\text{MB}]\\cdot 8}{R\\,[\\text{Mbps}]}=\\text{s}"
    reasoning: "Los 10^6 de Mb y de Mbps se cancelan, así que no hace falta escribirlos. Ejemplo del parcial 2025-II: 8 MB a 4 Mbps da 8·8/4 = 16 s; con 1500 B a 10 Mbps, 12000/10^7 = 1,2 ms."
  - name: "Distancia que iguala propagación y transmisión"
    tex: "d_{\\text{prop}}=d_{\\text{trans}}\\ \\Rightarrow\\ m = s\\cdot\\frac{L}{R}"
    reasoning: "Despejando m de m/s = L/R. Con s = 2,5×10^8 m/s, L = 1500 B y R = 10 Mbps: m = 2,5×10^8 · 1,2×10^-3 = 3×10^5 m = 300 km."
hasVisualization: true
visualizationType: "spacetime"
