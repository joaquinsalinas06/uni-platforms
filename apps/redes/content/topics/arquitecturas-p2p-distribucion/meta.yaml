id: "arquitecturas-p2p-distribucion"
title: "Distribución P2P vs Cliente-Servidor y Escalabilidad"
type: "concept"
unit: "s4"
prerequisites:
  - "capa-aplicacion-http"
buildsOn:
  - "capa-aplicacion-http"
usedBy:
  - "bittorrent-dht"
formulas:
  - name: "Tiempo mínimo de distribución cliente-servidor"
    tex: "D_{cs} \\ge \\max\\left\\{ \\frac{NF}{u_s},\\ \\frac{F}{d_{\\min}} \\right\\}"
    reasoning: "El servidor sube N copias del archivo (N·F bits a la tasa u_s) y el cliente más lento tarda F/d_min en bajar su copia; el tiempo mínimo es la mayor de las dos cotas."
  - name: "Tiempo mínimo de distribución P2P"
    tex: "D_{P2P} \\ge \\max\\left\\{ \\frac{F}{u_s},\\ \\frac{F}{d_{\\min}},\\ \\frac{NF}{u_s + \\sum_{i=1}^{N} u_i} \\right\\}"
    reasoning: "El servidor sube al menos una copia (F/u_s), el cliente más lento baja F bits (F/d_min) y entre todos hay que mover N·F bits con la capacidad de subida total u_s + Σu_i."
  - name: "Capacidad de subida total del sistema P2P"
    tex: "u_{\\text{total}} = u_s + u_1 + \\cdots + u_N"
    reasoning: "Suma de lo que el servidor y cada par pueden subir; es el denominador de la tercera cota de D_P2P."
hasVisualization: true
visualizationType: "xy-chart"
